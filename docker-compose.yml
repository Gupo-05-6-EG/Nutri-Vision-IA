services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      NUTRIVISION_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["rq", "worker", "analyses", "--with-scheduler", "--url", "redis://redis:6379/0"]
    env_file: .env
    environment:
      NUTRIVISION_REDIS_URL: redis://redis:6379/0
    volumes:
      - db-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  db-data:

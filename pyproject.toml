[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutri-vision-ia"
version = "0.2.0"
description = "Nutri-Vision-IA records core: meal photo analysis with AI vs confirmed traceability (RF23)"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "pi-heif>=0.18; python_version >= '3.10'",
    "pi-heif>=0.18,<0.23; python_version < '3.10'",
    "google-genai>=1.47,<3",
    "httpx>=0.27",
    "redis>=5",
    "rq>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "fakeredis>=2.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# Padrao do FastAPI: File(...), Form(...) e Path(...) como valor padrao.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Path", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

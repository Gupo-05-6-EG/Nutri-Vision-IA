[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutri-vision-ia"
version = "0.2.0"
description = "Nutri-Vision-IA records core: meal photo analysis with AI vs confirmed traceability (RF23)"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "google-genai>=1.47",
    "redis>=5",
    "rq>=2.0",
    "greenlet<3.2; python_version < '3.10'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "fakeredis>=2.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.csv"]
